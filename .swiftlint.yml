disabled_rules:
  - todo
  - inclusive_language # Domain concept: vocabulary mastery level
  - multiple_closures_with_trailing_closure # Standard for SwiftUI view actions & animations

opt_in_rules:
  - empty_count
  - closure_spacing
  - force_unwrapping
  - sorted_imports
  - vertical_whitespace_opening_braces
  - private_swiftui_state
  - unhandled_throwing_task

included:
  - VocabCraftApp
  - VocabCraftWidgetExtension
  - VocabCraftAppTests

excluded:
  - .build
  - DerivedData
  - "**/.build"
  - "**/Generated"

identifier_name:
  excluded:
    - id
    - db
    - xp
    - vm
    - ok
    - i
    - x
    - y
    - a
    - r
    - g
    - b
    - u
    - t
    - SQLITE_TRANSIENT

line_length:
  warning: 220
  error: 300

type_body_length:
  warning: 400
  error: 600

file_length:
  warning: 700
  error: 1200

function_body_length:
  warning: 85
  error: 150

cyclomatic_complexity:
  warning: 18
  error: 25
